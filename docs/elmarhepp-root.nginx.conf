# /etc/nginx/sites-available/elmarhepp-root.conf
#
# Kopie der Server-Konfiguration von elmarhepp.de auf nuernberg-16gb (netcup).
# Diese Datei wird nicht deployt — sie ist die versionierte Zweitschrift, damit
# nachvollziehbar bleibt, was auf dem Server steht. Nach jeder Aenderung dort
# gehoert sie nachgezogen.

server {
    listen 80;
    server_name www.elmarhepp.de;
    return 301 https://elmarhepp.de$request_uri;
}

server {
    listen 80;
    server_name elmarhepp.de;
    return 301 https://elmarhepp.de$request_uri;
}

server {
    listen 443 ssl;
    server_name www.elmarhepp.de;

    ssl_certificate /etc/letsencrypt/live/elmarhepp.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elmarhepp.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://elmarhepp.de$request_uri;
}

server {
    listen 443 ssl;
    server_name elmarhepp.de;

    root /var/www/elmarhepp-root;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/elmarhepp.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elmarhepp.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Der Webroot ist zugleich das Deploy-Verzeichnis: jede Datei darin waere
    # sonst oeffentlich abrufbar. scripts/ muss hochgeladen werden, weil der
    # Server damit legal-config.js erzeugt, darf aber nicht ausgeliefert werden;
    # Punktdateien ebenso wenig. Regex-Locations gehen Prefix-Locations vor,
    # deshalb greift das zuverlaessig vor dem SPA-Fallback unten.
    location ~ ^/(scripts|[.]) {
        return 404;
    }

    # $uri.html ist noetig, damit /impressum und /datenschutz die eigenen Seiten
    # liefern statt der Startseite. Auf genau diese beiden Pfade zeigen die
    # Fusszeilen aller Apps unter elmarhepp.de (platform/DEPLOYMENT.md 9).
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
